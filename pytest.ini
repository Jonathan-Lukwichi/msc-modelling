[pytest]
# Filter third-party deprecation noise so test output is readable.
# These are sklearn 1.6 -> 1.8 transition warnings emitted by xgboost
# and pmdarima; both packages will resolve them upstream.
filterwarnings =
    ignore::FutureWarning:sklearn
    ignore::FutureWarning:xgboost
    ignore::DeprecationWarning:pandas
    ignore::DeprecationWarning:statsmodels
