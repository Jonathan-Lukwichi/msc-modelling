# Continuous integration for the modelling pipeline.
#
# Runs on every push and PR: unit tests, then the cross-validation
# audit that checks every numeric claim in chap6/7/8.tex against the
# on-disk artefacts. Neither step needs the raw G1-G4 hospital data —
# both operate on the artefacts already committed to the repo, so this
# workflow needs no secrets and no external data mount.
#
# A red build here means one of two things: a real regression in the
# library code, or a chapter number that has drifted out of sync with
# the data it cites. Both are worth catching before they reach a
# reviewer.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test-and-crossval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-core.txt

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Run unit tests
        run: python -m pytest tests/ -q --no-header

      - name: Run cross-validation audit (chap6/7/8 claims vs on-disk data)
        run: python scripts/27_cross_validate_claims.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Run consistency audit (independent second reader)
        run: python scripts/29_consistency_audit.py
        env:
          PYTHONIOENCODING: utf-8
        continue-on-error: true
        # continue-on-error: this script also lints chap6/7/8.tex in
        # two sibling LaTeX checkouts that don't exist in CI (they're
        # local-machine paths). The artefact-vs-number checks (Pass C)
        # still run and print; a human should still read the log, but
        # a missing LaTeX checkout should not redden the whole build.
