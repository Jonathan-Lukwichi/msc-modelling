# HPO search ranges per model family, mirroring Ch3 §3.5.9 Table 3.1.

arima:
  method: stepwise_aic
  max_p: 3
  max_q: 3
  d: 1                      # fixed by §5.2.2 (ADF/KPSS)
  seasonal: false
  information_criterion: aic

sarima:
  method: stepwise_aic
  max_p: 2
  max_q: 2
  max_P: 2
  max_Q: 2
  d: 1                      # fixed by §5.2.2
  D: 1                      # fixed by §5.2.2
  m: 7                      # weekly seasonality
  information_criterion: aic

xgboost:
  method: grid_search
  n_estimators: [100, 200, 300, 500]
  max_depth: [3, 5, 6, 8]
  learning_rate: [0.01, 0.05, 0.1, 0.3]
  subsample: [0.7, 0.85, 1.0]

ann:
  method: random_search
  n_iter: 20
  hidden_layers: [1, 2]
  units: [64, 128, 192, 256]
  dropout: [0.1, 0.2, 0.3, 0.4]
  learning_rate_range: [0.0005, 0.01]
  batch_size: [16, 32, 64]
  early_stopping_patience: 10
  reduce_lr_patience: 5

lstm:
  method: tpe
  n_trials: 30
  time_budget_minutes: 90
  pruner: median
  lookback: [14, 21, 28]
  units: [64, 96, 128, 192, 256]
  dropout: [0.1, 0.2, 0.3, 0.4]
  learning_rate_range: [0.0005, 0.01]
  batch_size: [16, 32, 64]

cv:
  rolling_origin:
    horizon_days: 7
    step_days: 7
    expanding_window: true
    min_train_days: 365     # initial training window
